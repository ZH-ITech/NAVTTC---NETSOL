<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Feedback Intelligence - V2{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 1100px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0"><a href="{{ url_for('index') }}" class="text-decoration-none text-dark">Customer Feedback Intelligence</a>
      <span class="badge text-bg-primary">V2</span></h1>
    {% block topright %}{% endblock %}
  </div>
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
